# =============================================================================
# nginx — Downtime Game Reverse Proxy
# Routes: /api/* → backend, /ws → backend, /admin/* → admin panel, /* → dashboard
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Backend upstream
    upstream backend {
        server backend:8080;
    }

    # Dashboard upstream
    upstream dashboard {
        server dashboard:5173;
    }

    # Admin panel upstream
    upstream admin {
        server admin:5174;
    }

    server {
        listen 80;
        server_name downtime.local;

        # Health check
        location /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
        }

        # API routes
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket
        location /ws {
            proxy_pass http://backend/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Admin panel
        location /admin/ {
            proxy_pass http://admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Admin Panel WebSocket
        location /admin/ws {
            proxy_pass http://admin/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Dashboard — everything else
        location / {
            proxy_pass http://dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Proxy buffer for SPA
            proxy_buffering off;
        }
    }
}
