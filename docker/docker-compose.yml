# =============================================================================
# Docker Compose — Downtime Game
# Orchestrates: backend, dashboard, admin, nginx
# =============================================================================

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    networks:
      - downtime-net
    restart: unless-stopped

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    networks:
      - downtime-net
    restart: unless-stopped
    depends_on:
      - backend

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    networks:
      - downtime-net
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - downtime-net
    depends_on:
      - backend
      - dashboard
      - admin
    restart: unless-stopped

networks:
  downtime-net:
    driver: bridge
