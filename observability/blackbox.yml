# =============================================================================
# Blackbox Exporter Configuration — Downtime Game
# Modules: http_2xx for service health, icmp for network latency
# =============================================================================

modules:
  # ── HTTP 2xx: Probe HTTP endpoints expecting 200 OK ────
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4

  # ── ICMP: Ping hosts for latency and reachability ──────
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
      source_ip_address: ""  # uses default interface
